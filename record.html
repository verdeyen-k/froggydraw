<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Froggy Draw · Record the frogs</title>
  <style>
    :root { --bg: #17251c; --surface: #213328; --border: #345240; --text: #eef5ef; --dim: #93a99a; --frog: #7ed957; --bad: #ff6b6b; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    h1 { color: var(--frog); font-size: 28px; text-align: center; }
    p { color: var(--dim); max-width: 460px; text-align: center; line-height: 1.5; }
    ul { list-style: none; width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 10px; }
    li { background: var(--surface); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    li img { width: 48px; height: 48px; image-rendering: pixelated; flex: none; }
    .what { flex: 1; min-width: 120px; }
    .what b { display: block; font-size: 20px; }
    .what small { color: var(--dim); }
    .btns { display: flex; gap: 6px; }
    button {
      font: inherit; font-weight: 700; color: var(--text); background: var(--bg); border: 2px solid var(--border);
      border-radius: 10px; padding: 10px 12px; cursor: pointer;
    }
    button:disabled { opacity: .4; }
    button.rec { background: var(--bad); border-color: var(--bad); color: #fff; }
    button.rec.on { animation: pulse .8s infinite alternate; }
    @keyframes pulse { to { opacity: .55; } }
    .status { width: 100%; font-size: 13px; color: var(--dim); }
    .status.ok { color: var(--frog); }
    .status.bad { color: var(--bad); }
    .meter { width: 100%; height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; }
    .meter div { height: 100%; width: 0; background: var(--frog); transition: width .05s; }
  </style>
</head>
<body>
  <h1>Record the frogs</h1>
  <p>Tap 🔴 Record and say the word. It stops by itself after 3 seconds, or tap ⏹ Stop sooner. Tap ▶️ to hear it.
     Each one saves by itself, so record it again until you like it.</p>
  <p id="mic-note"></p>
  <ul id="list"></ul>
  <p>When you're happy with them, tell Claude and they'll go into the game.</p>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="frogs.js?v=1"></script>
<script>
'use strict';
(() => {
  // Temporary page: recordings go to froggydraw/voices/<key> in the kvgames database, where they can be
  // copied into the game.
  firebase.initializeApp({
    apiKey: 'AIzaSyAsJboNGVuESMhkivllUD0o8MUB5LUCMRQ', authDomain: 'kvgames.firebaseapp.com',
    databaseURL: 'https://kvgames-default-rtdb.firebaseio.com', projectId: 'kvgames',
    storageBucket: 'kvgames.firebasestorage.app', messagingSenderId: '463308384695',
    appId: '1:463308384695:web:5d57623ebd52101ad26032',
  });
  const voices = firebase.database().ref('froggydraw/voices');
  const MAX_MS = 3000;
  const COLORS = ['#ff5252', '#ff9f1a', '#ffe14d', '#5fd35f', '#2ee6c8', '#4d9dff', '#b36bff', '#ff7ac8'];
  const CLIPS = [
    { key: 'angry', say: 'Grrrr', note: 'optional: the game already growls' },
    { key: 'confused', say: 'Huh?' },
    { key: 'happy', say: 'Yay!' },
    { key: 'grossed', say: 'Eww!' },
    { key: 'aqua', say: 'Blub blub', note: 'optional: the game already makes bubbles' },
    { key: 'sad', say: 'Aww…' },
    { key: 'sorcerer', say: 'Hsssss', note: 'optional: the game already hisses' },
    { key: 'heart', say: 'Ooh la la!' },
  ];

  function frogURL(i) {
    const cv = document.createElement('canvas'), ctx = cv.getContext('2d'), ink = window.FROGGY_FROG_INK, hex = COLORS[i];
    cv.width = cv.height = 16;
    const dark = '#' + [1, 3, 5].map(k => Math.floor(parseInt(hex.slice(k, k + 2), 16) / 2).toString(16).padStart(2, '0')).join('');
    window.FROGGY_FROGS[i].rows.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === '.') return;
      ctx.fillStyle = ch === 'B' ? hex : ch === 'D' || ch === 'M' ? dark : ink[ch];
      ctx.fillRect(x, y, 1, 1);
    }));
    return cv.toDataURL();
  }

  if (!navigator.mediaDevices || !window.MediaRecorder) {
    document.getElementById('mic-note').textContent = "This browser can't record. Try Safari on the iPhone or Chrome on the computer.";
  }

  let stream = null, recording = null, analyser = null;
  async function mic() {
    if (!stream) {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      analyser = ac.createAnalyser();
      analyser.fftSize = 1024;
      ac.createMediaStreamSource(stream).connect(analyser);
    }
    if (analyser.context.state === 'suspended') analyser.context.resume();
    return stream;
  }
  function level() {  // 0..1, how loud the microphone is right now
    const d = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(d);
    let peak = 0;
    for (const x of d) peak = Math.max(peak, Math.abs(x));
    return peak;
  }
  const SILENT = 0.02;  // a recording that never got louder than this heard nothing
  const toDataURL = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });

  CLIPS.forEach((c, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<img src="${frogURL(i)}" alt=""><div class="what"><b>${c.say}</b><small>${window.FROGGY_FROGS[i].name} frog${c.note ? ` · ${c.note}` : ''}</small></div>
      <div class="btns"><button class="rec">🔴 Record</button><button class="play" disabled>▶️</button></div>
      <div class="meter" hidden><div></div></div><div class="status"></div>`;
    document.getElementById('list').append(li);
    const rec = li.querySelector('.rec'), play = li.querySelector('.play'), status = li.querySelector('.status');
    const meter = li.querySelector('.meter'), bar = meter.firstChild;
    let url = null;
    const setStatus = (text, cls = '') => { status.textContent = text; status.className = 'status ' + cls; };

    voices.child(c.key).once('value', s => {
      const v = s.val();
      if (!v || url) return;
      url = v.data;
      play.disabled = false;
      setStatus('Already recorded ✓', 'ok');
    });

    play.onclick = () => { if (url) new Audio(url).play(); };
    rec.onclick = async () => {
      if (recording) { if (recording.owner === c.key) recording.stop(); return; }
      try {
        const r = new MediaRecorder(await mic()), chunks = [];
        recording = r;
        r.owner = c.key;
        let loudest = 0;
        meter.hidden = false;
        const watch = setInterval(() => {
          const l = level();
          loudest = Math.max(loudest, l);
          bar.style.width = `${Math.min(100, l * 250)}%`;
        }, 50);
        r.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
        r.onstop = async () => {
          recording = null;
          clearInterval(watch);
          meter.hidden = true;
          rec.classList.remove('on');
          rec.textContent = '🔴 Record again';
          if (loudest < SILENT) {
            setStatus("That was silent: the microphone didn't hear anything, so it wasn't saved. Check that the right microphone is on and not muted, or try the phone.", 'bad');
            return;
          }
          const blob = new Blob(chunks, { type: r.mimeType || 'audio/mp4' });
          url = await toDataURL(blob);
          play.disabled = false;
          new Audio(url).play();
          setStatus('Saving…');
          try {
            await voices.child(c.key).set({ mime: blob.type, data: url, at: firebase.database.ServerValue.TIMESTAMP });
            setStatus('Saved ✓', 'ok');
          } catch (e) {
            setStatus("Couldn't save. Check the internet and record it again.", 'bad');
          }
        };
        r.start();
        rec.classList.add('on');
        rec.textContent = '⏹ Stop';
        setStatus('Recording… the green bar moves when it hears you');
        setTimeout(() => { if (recording === r) r.stop(); }, MAX_MS);
      } catch (e) {
        recording = null;
        setStatus('The microphone is blocked. Allow it in the browser settings, then try again.', 'bad');
      }
    };
  });
})();
</script>
</body>
</html>
